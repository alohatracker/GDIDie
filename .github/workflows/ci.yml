name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Static analysis (PSScriptAnalyzer)
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -RequiredVersion 1.25.0
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize
          if ($findings) { throw "PSScriptAnalyzer reported $($findings.Count) finding(s)" }
          Write-Host "Static analysis clean." -ForegroundColor Green

      - name: Unit tests
        shell: powershell
        run: |
          .\Tests\Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed ($LASTEXITCODE)" }

      - name: Smoke test (install-dir hardening on a real dir)
        shell: powershell
        run: |
          .\Tests\Smoke-Test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed ($LASTEXITCODE)" }

      - name: Parse check
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\Suppress-GDID.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_.Message }; throw "Parse errors" }
          Write-Host "Parse OK." -ForegroundColor Green
