name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # L-C: the action SHAs and the PSScriptAnalyzer version are pinned on purpose. A weekly run
    # surfaces bit-rot (a yanked module version, a deprecated runner image) on a cadence instead of
    # at whatever moment someone next pushes.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  # Primary lane: Windows PowerShell 5.1, the version the tool actually targets. -FailOnSkip makes
  # a platform-skipped assertion a build failure here, so the ACL/SID checks can never silently
  # stop running on the one platform that can run them.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install PSScriptAnalyzer (pinned)
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -RequiredVersion 1.25.0

      - name: Audit loop (parse + analyzer + unit + smoke + findings + coverage gate)
        shell: powershell
        run: |
          .\Tests\Invoke-AuditLoop.ps1 -FailOnSkip -ReportPath audit-report.json
          if ($LASTEXITCODE -ne 0) { throw "Audit loop failed ($LASTEXITCODE)" }

      # if: always() on purpose. The meta-test checks whether the GATE works; running it only when
      # the gate is already green means a broken gate hides its own meta-test. That is exactly how
      # A-13 slipped through: the loop step failed, this step was skipped, and the coverage table's
      # collapsed attribution went unexamined for a run.
      - name: Meta-test (the loop must reject injected regressions)
        if: always()
        shell: powershell
        run: |
          .\Tests\Test-AuditLoop.ps1
          if ($LASTEXITCODE -ne 0) { throw "Audit-loop meta-test failed ($LASTEXITCODE)" }

      - name: Audit report
        if: always()
        shell: powershell
        run: |
          if (Test-Path audit-report.json) { Get-Content audit-report.json -Raw | Write-Host }

  # Secondary lane: PowerShell 7 on Linux. It cannot exercise the ACL/service/firewall surface, so
  # those assertions SKIP rather than fail - but it does run every pure helper, every AST structural
  # check, and the blocklist drift checks, which is where regressions are cheapest to catch.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Audit loop (cross-platform subset)
        shell: pwsh
        run: |
          ./Tests/Invoke-AuditLoop.ps1 -SkipAnalyzer
          if ($LASTEXITCODE -ne 0) { throw "Audit loop failed ($LASTEXITCODE)" }

      - name: Meta-test (the loop must reject injected regressions)
        if: always()
        shell: pwsh
        run: |
          ./Tests/Test-AuditLoop.ps1
          if ($LASTEXITCODE -ne 0) { throw "Audit-loop meta-test failed ($LASTEXITCODE)" }
